[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sellbird-warmup"
version = "0.1.0"
description = "Self-hosted mailbox warmup and inbox-placement service for Sellbird (a pool of your own mailboxes that exchange, rescue and answer warmup mail)."
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["sellbird", "aiosmtplib>=5.1.3,<6", "pyyaml>=6.0.1,<7"]

[project.entry-points."sellbird.extensions"]
warmup = "sellbird_warmup.plugin:install"

[tool.setuptools]
packages = ["sellbird_warmup"]
