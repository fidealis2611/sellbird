<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellbird · Échauffement</title>
<script src="/static/auth.js"></script>
<link rel="stylesheet" href="/static/app.css">
<style>
 body{padding:24px;max-width:1100px;margin:0 auto}
 table{width:100%;border-collapse:collapse;margin:8px 0 24px}
 th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line,#ddd);font-size:14px}
 .ok{color:#15803d}.fail{color:#b91c1c}.warn{color:#b45309}
 button{padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<p><a href="/">Retour au tableau de bord</a></p>
<h1>Échauffement des boîtes</h1>
<p>Réseau interne : tes boîtes s'écrivent entre elles, sortent du spam et répondent.</p>
<div id="pool">Chargement</div>
<h2>Réputation du domaine et de l'IP</h2>
<div id="rep"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'-':(v*100).toFixed(1).replace('.',',')+' %';
async function load(){
  const [a,b]=await Promise.all([authFetch('/api/warmpool'),authFetch('/api/warmpool/reputation')]);
  if(!a.ok){document.getElementById('pool').textContent='Accès refusé : ouvre cette page depuis le lien du tableau de bord.';return}
  const pool=(await a.json()).mailboxes, rep=await b.json();
  document.getElementById('pool').innerHTML=pool.length?`<table><tr><th>Boîte</th><th>BU</th><th>Jour</th><th>État</th><th>Envoyés 14 j</th><th>Réponses</th><th>Spam</th><th>Google</th><th>Microsoft</th><th></th></tr>${pool.map(m=>{
    const prov=n=>{const p=(m.by_provider||[]).find(x=>x.provider===n);return p?pct(p.spam/((p.inbox+p.spam)||1)):'-'};
    return `<tr><td>${esc(m.address)}</td><td>${esc(m.bu)}</td><td>${m.day}</td><td class="${m.paused?'fail':m.warmed?'ok':'warn'}">${m.paused?'En pause':m.warmed?'Prête':'Échauffement'}</td><td>${m.sent_14d}</td><td>${m.replied_14d}</td><td>${pct(m.spam_rate)}</td><td>${prov('google')}</td><td>${prov('microsoft')}</td><td><button data-a="${esc(m.address)}" data-p="${m.paused?0:1}">${m.paused?'Reprendre':'Pause'}</button></td></tr>`}).join('')}</table>`:'<p>Aucune boîte dans le pool. Crée data/warmup/pool.yaml.</p>';
  document.getElementById('rep').innerHTML=Object.entries(rep).map(([addr,cs])=>`<h3>${esc(addr)}</h3>${cs.length?`<table>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td class="${c.status==='ok'?'ok':c.status==='fail'?'fail':'warn'}">${esc(c.status)}</td><td>${esc(c.detail)}</td></tr>`).join('')}</table>`:'<p>Pas encore vérifiée : <code>sellbird warmpool check</code></p>'}`).join('');
  document.querySelectorAll('button[data-a]').forEach(btn=>btn.onclick=async()=>{await authFetch(`/api/warmpool/${encodeURIComponent(btn.dataset.a)}/pause?paused=${btn.dataset.p==='1'}`,{method:'POST'});load()});
}
load();
</script>
</body>
</html>
